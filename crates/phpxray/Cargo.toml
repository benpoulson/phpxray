[package]
name = "phpxray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/benpoulson/phpxray"
description = "A fast PHP static analyzer written in Rust"

[lib]
name = "phpxray"
path = "src/lib.rs"

[[bin]]
name = "phpxray"
path = "src/main.rs"

[dependencies]
php-span.workspace = true
php-diagnostics.workspace = true
php-ast.workspace = true
php-intern.workspace = true
php-parser.workspace = true
php-resolve.workspace = true
php-index.workspace = true
php-reflect.workspace = true
php-infer.workspace = true
php-rules.workspace = true
php-config.workspace = true
walkdir.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
indicatif.workspace = true
rayon.workspace = true
notify.workspace = true
notify-rust.workspace = true
sha2.workspace = true
notify-debouncer-full.workspace = true

[target.'cfg(unix)'.dependencies]
# Local-time rendering for the watch header (localtime_r) without a date/time crate.
libc.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
# musl's allocator is the bottleneck in the static Linux builds we ship: parsing
# is allocation-dense, and mallocng serialises on a global lock and returns pages
# to the kernel aggressively. Measured on a 21k-file project, the released musl
# binary took 54s where the same analysis takes ~6s on a system allocator, with
# system time 6x wall time and *no* speedup from extra threads. Only the musl
# targets pay for this dependency; macOS and glibc allocators are fine as they are.
mimalloc = { version = "0.1", default-features = false }
