name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one in-flight run per ref: a new push cancels the previous run so we
# never pay for superseded builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across CI machines and only bloat the
  # cache; a clean cached build is faster without them.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # clippy + test share ONE runner (and therefore one compilation) — cheaper in
  # billed minutes than splitting into parallel jobs that each recompile deps.
  check:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable = the toolchain the release pipeline builds with, so a green CI
      # predicts a green release. The crates use no nightly features.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches the cargo registry, git deps, and target/ keyed on Cargo.lock +
      # rustc version. PRs read-share the base branch's cache. cache-on-failure
      # keeps the compiled deps even when clippy/test fail, so the fix-up rerun
      # is cheap.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      # Formatting was previously unenforced, so unformatted code landed and the
      # next `cargo fmt` mixed churn into an unrelated diff. Runs first: it is
      # the cheapest check and needs no compilation.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The full Tier-C corpus (xtask corpus / astdiff / difftokens) needs the
      # gitignored php-src checkout and a local PHP with the php-ast extension,
      # so it cannot run here. `cargo test` above already covers the committed
      # canary; this step names it so a green CI is not mistaken for having
      # verified parser totality against the real 5.3k-file corpus.
      - name: Parser totality canary (stand-in for Tier C)
        run: cargo test -p php-parser --test totality
