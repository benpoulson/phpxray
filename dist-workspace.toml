[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Homebrew is intentionally omitted for
# now: it needs a separate tap repo + HOMEBREW_TAP_TOKEN secret. The shell
# installer (curl | sh) covers macOS + Linux with zero extra setup; add
# "homebrew" back (plus `tap`/`publish-jobs`) once the tap is ready.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax) — Mac + Linux.
# Linux uses musl for fully-static, dependency-free binaries that run on any
# distro (Alpine, old glibc, scratch/distroless containers) unchanged.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
