[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# release.yml carries hand-added "Stamp the workspace version from the tag" steps
# (see .github/scripts/stamp-version.sh) so that releases are triggered by pushing
# a version tag alone, with no manual Cargo.toml bump. dist would otherwise refuse
# to run against a workflow it did not generate verbatim. The cost: dist no longer
# tells us when release.yml is stale, so after bumping cargo-dist-version, run
# `dist init` and re-add those four steps by hand.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app. dist's own "shell" installer is
# deliberately NOT used: it only installs user-locally (CARGO_HOME or ~/subdir),
# never escalates, and edits shell profiles to fix up PATH -- none of which suits
# a system-wide install, a Docker build or a CI job. ./install.sh replaces it and
# is attached to every release via [[dist.extra-artifacts]] below.
installers = ["homebrew"]
# The Homebrew tap to publish the generated formula into.
tap = "benpoulson/homebrew-tap"
# Actually push the formula to the tap on release (needs the HOMEBREW_TAP_TOKEN
# secret: a PAT with contents:write on the tap repo).
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax) — Mac + Linux.
# Linux uses musl for fully-static, dependency-free binaries that run on any
# distro (Alpine, old glibc, scratch/distroless containers) unchanged.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Attach ./install.sh to every release, so the documented URL
# https://github.com/benpoulson/phpxray/releases/latest/download/install.sh
# serves the installer that shipped with that release. The build command is a
# syntax check: a release fails rather than publishing a broken installer.
[[dist.extra-artifacts]]
working-dir = "."
build = ["sh", "-n", "install.sh"]
artifacts = ["install.sh"]
