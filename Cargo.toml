[workspace]
resolver = "2"
members = [
    "crates/php-span",
    "crates/php-intern",
    "crates/php-diagnostics",
    "crates/php-lexer",
    "crates/php-ast",
    "crates/php-parser",
    "crates/php-resolve",
    "crates/php-index",
    "crates/php-rules",
    "crates/php-phpdoc",
    "crates/php-types",
    "crates/php-reflect",
    "crates/php-infer",
    "crates/php-config",
    "crates/phpxray",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/benpoulson/phpxray"

[workspace.dependencies]
# Internal crates (dependency edges enforced per-crate; see plan).
php-span = { path = "crates/php-span" }
php-intern = { path = "crates/php-intern" }
php-diagnostics = { path = "crates/php-diagnostics" }
php-lexer = { path = "crates/php-lexer" }
php-ast = { path = "crates/php-ast" }
php-parser = { path = "crates/php-parser" }
php-resolve = { path = "crates/php-resolve" }
php-index = { path = "crates/php-index" }
php-rules = { path = "crates/php-rules" }
php-phpdoc = { path = "crates/php-phpdoc" }
php-types = { path = "crates/php-types" }
php-reflect = { path = "crates/php-reflect" }
php-infer = { path = "crates/php-infer" }
php-config = { path = "crates/php-config" }
phpxray = { path = "crates/phpxray" }

# Third-party
insta = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
rayon = "1"
lasso = { version = "0.7", features = ["multi-threaded"] }
notify = "8"
notify-debouncer-full = "0.5"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 2

# Dependencies are compiled once and cached, so optimize them fully regardless.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
