[workspace]
resolver = "2"
members = [
    "crates/php-span",
    "crates/php-intern",
    "crates/php-diagnostics",
    "crates/php-lexer",
    "crates/php-ast",
    "crates/php-parser",
    "crates/php-resolve",
    "crates/php-index",
    "crates/php-rules",
    "crates/php-phpdoc",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexelity/php-analyzer"

[workspace.dependencies]
# Internal crates (dependency edges enforced per-crate; see plan).
php-span = { path = "crates/php-span" }
php-intern = { path = "crates/php-intern" }
php-diagnostics = { path = "crates/php-diagnostics" }
php-lexer = { path = "crates/php-lexer" }
php-ast = { path = "crates/php-ast" }
php-parser = { path = "crates/php-parser" }
php-resolve = { path = "crates/php-resolve" }
php-index = { path = "crates/php-index" }
php-rules = { path = "crates/php-rules" }
php-phpdoc = { path = "crates/php-phpdoc" }

# Third-party
insta = "1"
walkdir = "2"

[profile.release]
# The whole point of the project is speed; optimise the corpus runner & lexer hard.
lto = "thin"
codegen-units = 1

# Dev speed. The heavy dev tools (xtask corpus/astdiff/resolve/index/gen-stubs)
# run via `cargo run` (the dev profile) over thousands of files, so a little
# optimisation pays for itself many times over. opt-level=2 gives a big runtime
# win; debug-assertions/overflow-checks stay on.
[profile.dev]
opt-level = 2

# Dependencies are compiled once and cached, so optimise them fully regardless.
[profile.dev.package."*"]
opt-level = 3

# `--profile quick`: fully optimised but fast to build (no LTO, parallel codegen)
# — for the heaviest corpus sweeps without the slow release link.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
